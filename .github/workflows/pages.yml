name: Build and Deploy Slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: CI heartbeat
        run: |
          echo "Job started at $(date -u)"
          uname -a

      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@v4

      - name: After checkout
        run: |
          echo "Checkout done at $(date -u)"
          ls -lah

      - name: Setup Quarto
        timeout-minutes: 5
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Quarto version
        run: |
          echo "Quarto setup done at $(date -u)"
          quarto --version

      - name: Quarto check
        timeout-minutes: 5
        run: quarto check

      - name: Render slides (debug logs to console)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          quarto render slides.qmd \
            --log-level debug \
            --log-format plain \
            2>&1 | tee quarto-render.log

      - name: Debug rendered output
        if: always()
        run: |
          echo "=== rendered artifacts ==="
          ls -lah slides.html slides_files || true
          echo "=== tail quarto log ==="
          tail -n 300 quarto-render.log || true

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarto-render-log
          path: quarto-render.log
          if-no-files-found: ignore

      - name: Prepare deploy directory
        run: |
          mkdir -p public
          cp -r slides.html slides_files figures styles.css public/
          cp public/slides.html public/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
