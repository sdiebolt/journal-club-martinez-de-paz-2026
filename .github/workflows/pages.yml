name: Build and Deploy Slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Debug environment
        run: |
          echo "=== tool versions ==="
          quarto --version
          python3 --version || true
          node --version || true
          echo "=== quarto check ==="
          quarto check || true
          echo "=== repo files ==="
          ls -lah

      - name: Render slides
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          quarto render slides.qmd

      - name: Debug rendered output
        if: always()
        run: |
          echo "=== rendered artifacts ==="
          ls -lah slides.html slides_files || true

      - name: Prepare deploy directory
        run: |
          mkdir -p public
          cp -r slides.html slides_files figures styles.css public/
          cp public/slides.html public/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
